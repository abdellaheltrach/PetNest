    <!doctype html>
<html lang="fr">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

<body class="font-sans text-neutral-900 bg-neutral-0">
  
  <header  class="bg-neutral-0 border-b border-neutral-200 relative max-w-72rem">
  <nav class="flex items-center justify-between h-20 px-4 md:px-30">

    <!-- Logo -->
    <!-- <a href="Accueil.html" class="flex items-center"> -->
      <img src="img/logopetnest.png" alt="PetNest logo" class="h-9 w-auto">
    </a>

    <!-- Liens pc-->
    <ul class="hidden md:flex items-center gap-8 text-sm">
      <li><a href="Accueil.html" class="hover:text-primary-700 ">Accueil</a></li>
      <li><a href="Botique.html" class="hover:text-primary-700">Boutique</a></li>
      <li><a href="Adoption.html" class="hover:text-primary-700">Adoption</a></li>
      <li><a href="Services-contact.html" class="hover:text-primary-700">Services</a></li>
      <li><a href="Services-contact.html" class="hover:text-primary-700">Contact</a></li>
    </ul>

    <!-- Droite -->
    <div class="flex items-center gap-4">

      <!-- Panier  pc + tele -->
      <a href="Panier.html" aria-label="Panier" class="relative hover:text-primary-700">
        <ion-icon name="cart-outline" class="text-2xl"></ion-icon>
        <span class="absolute -top-1 -right-2 flex h-4 w-4 items-center justify-center rounded-full bg-red-600 text-[10px] text-white">2</span>

      <!-- Bouton RDV pc -->
      <a href="Services-contact.html"

        Prendre RDV
      </a>

      <!-- Burger : phone seulement -->
      <button id="burger" class="text-3xl md:hidden" aria-label="Menu" aria-expanded="false">
        <ion-icon name="menu-outline"></ion-icon>
      </button>
    </div>
  </nav>

  <!-- Menu tele -->
  <div id="mobileMenu" class="hidden flex-col gap-5 p-5 border-t border-neutral-200 md:hidden">
    <ul class="flex flex-col">
      <li>
        <a href="Accueil.html" class="flex items-center justify-between py-3 border-b border-neutral-200 text-primary-700">
          Accueil <ion-icon name="chevron-forward-outline"></ion-icon>
        </a>
      </li>
      <li>
        <a href="Botique.html" class="flex items-center justify-between py-3 border-b border-neutral-200">
          Boutique <ion-icon name="chevron-forward-outline"></ion-icon>
        </a>
      </li>
      <li>

          Adoption <ion-icon name="chevron-forward-outline"></ion-icon>

      <li>

      <li>

    </a>

</header>

  <script>
    const burger = document.getElementById("burger");
    const mobileMenu = document.getElementById("mobileMenu");
    
    burger.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
      mobileMenu.classList.toggle("flex");
      const isOpen = !mobileMenu.classList.contains("hidden");
      burger.innerHTML = `<ion-icon name="${isOpen ? "close-outline" : "menu-outline"}"></ion-icon>`;
      burger.setAttribute("aria-expanded", isOpen);
    });
  </script>
