<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <link rel="stylesheet" href="../dist/output.css">

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>


<header class="bg-white shadow-sm">
  <nav class="flex items-center justify-between p-4">


    <img
      src="img/logopetnest.jpg"
      alt="PetNest logo"
      class="w-24 md:w-32"
    >

    
    <ul class="hidden md:flex items-center gap-6">
      <li><a href="Accueil.html" class="hover:text-gray-500">Accueil</a></li>
      <li><a href="Botique.html" class="hover:text-gray-500">Boutique</a></li>
      <li><a href="Adoption.html" class="hover:text-gray-500">Adoption</a></li>
      <li><a href="Services-contact.html" class="hover:text-gray-500">Services-contact</a></li>
      <li><a href="Panier.html" class="hover:text-gray-500">Panier</a></li>
    </ul>

      <div class="flex items-center gap-4">
      <a href="Panier.html" aria-label="Panier">
        <ion-icon name="cart-outline" class="text-2xl"></ion-icon>
      </a>

      <button
        id="burger"
        class="text-3xl md:hidden"
        aria-label="Menu"
        aria-expanded="false"
      >
        <ion-icon name="menu-outline"></ion-icon>
      </button>
    </div>

  </nav>


  <ul
    id="mobileMenu"
    class="hidden flex-col gap-4 p-5 border-t md:hidden"
  >
    <li><a href="Accueil.html" class="hover:text-gray-500">Accueil</a></li>
    <li><a href="Botique.html" class="hover:text-gray-500">Boutique</a></li>
    <li><a href="Adoption.html" class="hover:text-gray-500">Adoption</a></li>
    <li><a href="Services-contact.html" class="hover:text-gray-500">Services-contact</a></li>
    <li><a href="Panier.html" class="hover:text-gray-500">Panier</a></li>
  </ul>
</header>

<script>
  const burger = document.getElementById("burger");
  const mobileMenu = document.getElementById("mobileMenu");

  burger.addEventListener("click", function () {
    mobileMenu.classList.toggle("hidden");
    mobileMenu.classList.toggle("flex");

    const isOpen = !mobileMenu.classList.contains("hidden");

    burger.innerHTML = isOpen
      ? '<ion-icon name="close-outline"></ion-icon>'
      : '<ion-icon name="menu-outline"></ion-icon>';

    burger.setAttribute("aria-expanded", isOpen);
  });
</script>
</body>
</body>
</html>
